<uiView onLoad="
  // Simple interval data directly in HTML
  var intervals = [
    { duration: 600, pace: 360, color: '#1E90FF' },
    { duration: 900, pace: 420, color: '#32CD32' },
    { duration: 600, pace: 300, color: '#FF4500' },
    { duration: 900, pace: 480, color: '#228B22' },
    { duration: 600, pace: 330, color: '#FF6347' }
  ];

  // Helper function to calculate total duration
  var calculateTotalDuration = function() {
    var total = 0;
    for (var i = 0; i < intervals.length; i++) {
      total += intervals[i].duration;
    }
    return total;
  };

  // Simple drawing function
  var drawIntervalChart = function(ctx, currentTime) {
    var totalDuration = calculateTotalDuration();
    var width = ctx.width;
    var height = ctx.height;

    // Clear canvas
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);

    // Find min and max pace for Y-axis scaling
    var minPace = Infinity;
    var maxPace = -Infinity;
    for (var i = 0; i < intervals.length; i++) {
      if (intervals[i].pace < minPace) minPace = intervals[i].pace;
      if (intervals[i].pace > maxPace) maxPace = intervals[i].pace;
    }

    // Add some padding to the pace range
    var paceRange = maxPace - minPace;
    maxPace += paceRange * 0.1;
    minPace -= paceRange * 0.1;
    if (maxPace <= minPace) maxPace = minPace + 1;

    var paceScale = height / (maxPace - minPace);

    // Draw intervals with height based on pace
    var x = 0;
    for (var i = 0; i < intervals.length; i++) {
      var intervalWidth = (intervals[i].duration / totalDuration) * width;
      // Calculate bar height based on pace (slower pace = taller bar)
      var barHeight = ((intervals[i].pace - minPace) * paceScale);
      var barY = height - barHeight;

      ctx.fillStyle = intervals[i].color;
      ctx.fillRect(x, barY, intervalWidth, barHeight);
      x += intervalWidth;
    }

    // Draw progress line
    if (currentTime > 0) {
      var progressX = (currentTime / totalDuration) * width;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(progressX, 0);
      ctx.lineTo(progressX, height);
      ctx.stroke();
    }

    // Draw X-axis label (Time)
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Time (min)', width / 2, height - 5);

    // Draw Y-axis label (Pace)
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(5, height / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Pace (min/km)', 0, 0);
    ctx.restore();
  };
">

  <!-- Simple canvas visualization -->
  <object id="intervalChart" type="canvas"
          build="ctx => drawIntervalChart(ctx, input.Duration)"
          style="position:absolute; left:15%; width:70%; top:30%; height:40%;" />

  <!-- Title -->
  <div class="sp-title-bg" style="width:100%;height:20%;"></div>
  <div class="sp-title-text sp-t-m p-hc" style="top:5%">Interval Progress</div>

  <!-- Current time display -->
  <div class="sp-d-s f-num" style="top:calc(85% - 50%e);left:calc(50% - 50%e);">
    <eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="--" />
  </div>
</uiView>
