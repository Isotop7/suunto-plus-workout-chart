<uiView onLoad="
  /* Template data until Suunto Plus Guide data is available */
  var intervals = [
    { duration: 500, pace: 360 },
    { duration: 900, pace: 420 },
    { duration: 400, pace: 300 },
    { duration: 700, pace: 480 },
    { duration: 600, pace: 330 }
  ];

  var currentTime = 0;
  var durationToken;

  var totalDuration = 0;
  for (var i = 0; i < intervals.length; i++) {
    totalDuration += intervals[i].duration;
  }

  var minPace = Infinity, maxPace = -Infinity;
  for (var i = 0; i < intervals.length; i++) {
    if (intervals[i].pace < minPace) minPace = intervals[i].pace;
    if (intervals[i].pace > maxPace) maxPace = intervals[i].pace;
  }

  var formatTime = function(secs) {
    var m = Math.floor(secs / 60);
    var s = Math.floor(secs % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  var calcIntervalRemaining = function(time) {
    var elapsed = 0;
    for (var i = 0; i < intervals.length; i++) {
      elapsed += intervals[i].duration;
      if (time < elapsed) {
        return Math.ceil(elapsed - time);
      }
    }
    return 0;
  };

  var paceColor = function(pace) {
    var rng = maxPace - minPace;
    if (rng < 1) return '#FF0000';
    var t = (pace - minPace) / rng; // 0 = fast, 1 = slow
    var rb = Math.round(255 * t);   // fast=0 (green), slow=255 (white)
    var rbh = (rb < 16 ? '0' : '') + rb.toString(16);
    return '#' + rbh + 'ff' + rbh;
  };

  var drawChart = function(ctx) {
    var w = ctx.width;
    var h = ctx.height;

    var lm = Math.round(w * 0.15);
    var bm = Math.round(h * 0.15);
    var tm = 4;
    var rm = 4;
    var cw = w - lm - rm;
    var ch = h - tm - bm;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);

    var pr = maxPace - minPace;
    if (pr < 30) pr = 30;
    var pMin = minPace - pr * 0.1;
    var pMax = maxPace + pr * 0.1;

    var fs = Math.min(11, Math.max(8, Math.round(w / 26)));
    ctx.font = 'bold ' + fs + 'px monospace';

    // Y axis: 3 grid lines with pace labels
    for (var gi = 0; gi <= 3; gi++) {
      var gPace = pMin + (pMax - pMin) * gi / 3;
      var gy = tm + ch - (ch * gi / 3);

      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lm, gy);
      ctx.lineTo(lm + cw, gy);
      ctx.stroke();

      var lbl = formatTime(gPace);
      var tw = ctx.measureText(lbl).width;
      ctx.fillStyle = '#AAAAAA';
      ctx.fillText(lbl, lm - tw - 10, gy - Math.round(fs * 0.4));
    }

    // Interval bars
    var bx = lm;
    for (var bi = 0; bi < intervals.length; bi++) {
      var iv = intervals[bi];
      var bw = (iv.duration / totalDuration) * cw;
      var bh = ((pMax - iv.pace) / (pMax - pMin)) * ch;
      ctx.fillStyle = paceColor(iv.pace);
      ctx.fillRect(bx, tm + ch - bh, bw - 1, bh);

      // Pace label — inside bar if tall enough, above bar otherwise
      var paceLbl = formatTime(iv.pace);
      var pltw = ctx.measureText(paceLbl).width;
      if (bw - 1 > pltw + 2) {
        var barTop = tm + ch - bh;
        // Tall enough: draw inside at top edge, dark text on colored bar
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(paceLbl, bx + (bw - 1) / 2 - pltw / 2, barTop);
      }

      bx += bw;
    }

    // Axes
    ctx.strokeStyle = '#444444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lm, tm);
    ctx.lineTo(lm, tm + ch);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lm, tm + ch);
    ctx.lineTo(lm + cw, tm + ch);
    ctx.stroke();

    // X axis labels
    var xStep = totalDuration <= 1800 ? 300 : 600;
    for (var xi = 0; xi <= totalDuration; xi += xStep) {
      var xp = lm + (xi / totalDuration) * cw;
      var xlbl = '' + Math.round(xi / 60);
      var xtw = ctx.measureText(xlbl).width;
      ctx.strokeStyle = '#333333';
      ctx.beginPath();
      ctx.moveTo(xp, tm + ch);
      ctx.lineTo(xp, tm + ch + 2);
      ctx.stroke();
      var labelX = xp - xtw / 2;
      if (labelX + xtw > lm + cw) labelX = lm + cw - xtw;
      ctx.fillStyle = '#AAAAAA';
      ctx.fillText(xlbl, labelX, tm + ch + 6);
    }

    // Vertical time marker
    if (currentTime > 0) {
      var px = lm + Math.min(1, currentTime / totalDuration) * cw;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px, tm);
      ctx.lineTo(px, tm + ch);
      ctx.stroke();
    }
  };
"
onActivate="
  durationToken = $.subscribe('/Activity/Move/-1/Duration/Current', function(v) {
    currentTime = v;
    setText('#elapsedVal', formatTime(v));
    setText('#intervalVal', formatTime(calcIntervalRemaining(v)));
    control('#intervalChart', 'REFRESH');
  });
"
onDeactivate="
  $.unsubscribe(durationToken);
">

  <object id="intervalChart" type="canvas"
          build="ctx => drawChart(ctx)"
          style="position:absolute; left:8%; width:80%; top:23%; height:48%;" />

  <div class="sp-title-bg" style="width:100%;height:17%;"></div>
  <div class="sp-title-text sp-t-s p-hc" style="top:5%">Interval Progress</div>

  <!-- Elapsed time -->
  <div class="sp-t-s cm-mid" style="position:absolute; top:72%; left:calc(35% - 50%e);">elapsed</div>
  <div id="elapsedVal" class="sp-b-m f-num" style="position:absolute; top:calc(85% - 50%e); left:calc(35% - 50%e);">-:--</div>

  <!-- Remaining in current interval -->
  <div class="sp-t-s cm-mid" style="position:absolute; top:72%; left:calc(65% - 50%e);">interval</div>
  <div id="intervalVal" class="sp-b-m f-num" style="position:absolute; top:calc(85% - 50%e); left:calc(65% - 50%e);">-:--</div>

</uiView>
