<uiView onLoad="
  var intervals = [
    { duration: 600, pace: 360 },
    { duration: 900, pace: 420 },
    { duration: 600, pace: 300 },
    { duration: 900, pace: 480 },
    { duration: 600, pace: 330 }
  ];

  var currentTime = 0;
  var durationToken;

  var totalDuration = 0;
  for (var i = 0; i < intervals.length; i++) {
    totalDuration += intervals[i].duration;
  }

  var minPace = Infinity, maxPace = -Infinity;
  for (var i = 0; i < intervals.length; i++) {
    if (intervals[i].pace < minPace) minPace = intervals[i].pace;
    if (intervals[i].pace > maxPace) maxPace = intervals[i].pace;
  }

  var formatPace = function(secs) {
    var m = Math.floor(secs / 60);
    var s = Math.floor(secs % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  var paceColor = function(pace) {
    var rng = maxPace - minPace;
    if (rng < 1) return '#FF0000';
    var t = (pace - minPace) / rng;
    var r = Math.round(255 * (1 - t));
    var g = Math.round(255 * t);
    var rh = (r < 16 ? '0' : '') + r.toString(16);
    var gh = (g < 16 ? '0' : '') + g.toString(16);
    return '#' + rh + gh + '00';
  };

  var drawChart = function(ctx) {
    var w = ctx.width;
    var h = ctx.height;

    // Compact margins scaled to canvas size
    var lm = Math.round(w * 0.12);
    var bm = Math.round(h * 0.14);
    var tm = 3;
    var rm = 3;
    var cw = w - lm - rm;
    var ch = h - tm - bm;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);

    var pr = maxPace - minPace;
    if (pr < 30) pr = 30;
    var pMin = minPace - pr * 0.1;
    var pMax = maxPace + pr * 0.1;

    var fs = Math.min(11, Math.max(8, Math.round(w / 26)));
    ctx.font = fs + 'px monospace';

    // Y axis: 3 grid lines with pace labels
    for (var gi = 0; gi <= 3; gi++) {
      var gPace = pMin + (pMax - pMin) * gi / 3;
      var gy = tm + ch - (ch * gi / 3);

      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lm, gy);
      ctx.lineTo(lm + cw, gy);
      ctx.stroke();

      var lbl = formatPace(gPace);
      var tw = ctx.measureText(lbl).width;
      ctx.fillStyle = '#666666';
      ctx.fillText(lbl, lm - tw - 3, gy - Math.round(fs * 0.4));
    }

    // Interval bars
    var bx = lm;
    for (var bi = 0; bi < intervals.length; bi++) {
      var iv = intervals[bi];
      var bw = (iv.duration / totalDuration) * cw;
      var bh = ((pMax - iv.pace) / (pMax - pMin)) * ch;
      ctx.fillStyle = paceColor(iv.pace);
      ctx.fillRect(bx, tm + ch - bh, bw - 1, bh);
      bx += bw;
    }

    // Axes
    ctx.strokeStyle = '#444444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lm, tm);
    ctx.lineTo(lm, tm + ch);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lm, tm + ch);
    ctx.lineTo(lm + cw, tm + ch);
    ctx.stroke();

    // X axis labels
    var xStep = totalDuration <= 1800 ? 300 : 600;
    for (var xi = 0; xi <= totalDuration; xi += xStep) {
      var xp = lm + (xi / totalDuration) * cw;
      var xlbl = '' + Math.round(xi / 60);
      var xtw = ctx.measureText(xlbl).width;
      ctx.strokeStyle = '#333333';
      ctx.beginPath();
      ctx.moveTo(xp, tm + ch);
      ctx.lineTo(xp, tm + ch + 2);
      ctx.stroke();
      ctx.fillStyle = '#666666';
      ctx.fillText(xlbl, xp - xtw / 2, tm + ch + 3);
    }

    // Vertical time marker
    if (currentTime > 0) {
      var px = lm + Math.min(1, currentTime / totalDuration) * cw;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px, tm);
      ctx.lineTo(px, tm + ch);
      ctx.stroke();
    }
  };
"
onActivate="
  durationToken = $.subscribe('/Activity/Move/-1/Duration/Current', function(v) {
    currentTime = v;
    control('#intervalChart', 'REFRESH');
  });
"
onDeactivate="
  $.unsubscribe(durationToken);
">

  <object id="intervalChart" type="canvas"
          build="ctx => drawChart(ctx)"
          style="position:absolute; left:0; width:100%; top:22%; height:50%;" />

  <div class="sp-title-bg" style="width:100%;height:20%;"></div>
  <div class="sp-title-text sp-t-m p-hc" style="top:5%">Interval Progress</div>

  <div class="sp-d-s f-num" style="top:calc(82% - 50%e);left:calc(50% - 50%e);">
    <eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="--" />
  </div>
</uiView>
