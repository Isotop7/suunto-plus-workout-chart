<uiView onLoad="
  var intervalsStr = localStorage.getItem('Intervals') || '500:360;900:420;400:300;700:480;600:330';
  var intervals = [];
  var intervalParts = intervalsStr.split(';');
  for (var i = 0; i < intervalParts.length; i++) {
    var kv = intervalParts[i].split(':');
    if (kv.length !== 2 || !kv[0] || !kv[1]) continue;
    var duration = parseInt(kv[0], 10);
    var pace = parseInt(kv[1], 10);
    if (!isNaN(duration) && !isNaN(pace)) {
      intervals.push({ duration: duration, pace: pace });
    }
  }

  var currentTime = 0;
  var durationToken;

  var totalDuration = 0;
  for (var i = 0; i < intervals.length; i++) {
    totalDuration += intervals[i].duration;
  }

  var minPace = Infinity, maxPace = -Infinity;
  for (var i = 0; i < intervals.length; i++) {
    if (intervals[i].pace < minPace) minPace = intervals[i].pace;
    if (intervals[i].pace > maxPace) maxPace = intervals[i].pace;
  }

  var formatTime = function(seconds) {
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = Math.floor(seconds % 60);
    return minutes + ':' + (remainingSeconds < 10 ? '0' : '') + remainingSeconds;
  };

  var calcIntervalRemaining = function(elapsedTime) {
    var intervalEnd = 0;
    for (var i = 0; i < intervals.length; i++) {
      intervalEnd += intervals[i].duration;
      if (elapsedTime < intervalEnd) {
        return Math.ceil(intervalEnd - elapsedTime);
      }
    }
    return 0;
  };

  var paceColor = function(pace) {
    var paceRange = maxPace - minPace;
    if (paceRange < 1) return '#FF0000';
    var normalizedPace = (pace - minPace) / paceRange; // 0 = fast, 1 = slow
    var whiteChannel = Math.round(255 * normalizedPace); // fast=0 (green), slow=255 (white)
    var whiteChannelHex = (whiteChannel < 16 ? '0' : '') + whiteChannel.toString(16);
    return '#' + whiteChannelHex + 'ff' + whiteChannelHex;
  };

  var drawChart = function(ctx) {
    var canvasWidth = ctx.width;
    var canvasHeight = ctx.height;

    var leftMargin = Math.round(canvasWidth * 0.15);
    var bottomMargin = Math.round(canvasHeight * 0.15);
    var topMargin = 4;
    var rightMargin = 4;
    var chartWidth = canvasWidth - leftMargin - rightMargin;
    var chartHeight = canvasHeight - topMargin - bottomMargin;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    if (intervals.length === 0) return;

    var paceSpread = maxPace - minPace;
    if (paceSpread < 30) paceSpread = 30;
    var paceAxisMin = minPace - paceSpread * 0.1;
    var paceAxisMax = maxPace + paceSpread * 0.1;

    var fontSize = Math.min(11, Math.max(8, Math.round(canvasWidth / 26)));
    ctx.font = 'bold ' + fontSize + 'px monospace';

    // Y axis: grid lines with pace labels
    for (var gridIndex = 0; gridIndex <= 3; gridIndex++) {
      var gridPace = paceAxisMin + (paceAxisMax - paceAxisMin) * gridIndex / 3;
      var gridY = topMargin + chartHeight - (chartHeight * gridIndex / 3);

      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(leftMargin, gridY);
      ctx.lineTo(leftMargin + chartWidth, gridY);
      ctx.stroke();

      var gridLabel = formatTime(gridPace);
      var gridLabelWidth = ctx.measureText(gridLabel).width;
      ctx.fillStyle = '#AAAAAA';
      ctx.fillText(gridLabel, leftMargin - gridLabelWidth - 10, gridY - Math.round(fontSize * 0.4));
    }

    // Interval bars
    var barX = leftMargin;
    for (var barIndex = 0; barIndex < intervals.length; barIndex++) {
      var interval = intervals[barIndex];
      var barWidth = (interval.duration / totalDuration) * chartWidth;
      var barHeight = ((paceAxisMax - interval.pace) / (paceAxisMax - paceAxisMin)) * chartHeight;
      var barTop = topMargin + chartHeight - barHeight;

      ctx.fillStyle = paceColor(interval.pace);
      ctx.fillRect(barX, barTop, Math.max(1, barWidth - 1), barHeight);

      // Pace label — inside bar if tall enough, above bar otherwise
      var paceLabel = formatTime(interval.pace);
      var paceLabelWidth = ctx.measureText(paceLabel).width;
      if (barWidth - 1 > paceLabelWidth + 2) {
        var labelX = barX + (barWidth - 1) / 2 - paceLabelWidth / 2;
        if (barHeight >= fontSize + 2) {
          ctx.fillStyle = '#1a1a1a';
          ctx.fillText(paceLabel, labelX, barTop + fontSize + 1);
        } else {
          ctx.fillStyle = '#AAAAAA';
          ctx.fillText(paceLabel, labelX, barTop - fontSize - 3);
        }
      }

      barX += barWidth;
    }

    // Axes
    ctx.strokeStyle = '#444444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(leftMargin, topMargin);
    ctx.lineTo(leftMargin, topMargin + chartHeight);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(leftMargin, topMargin + chartHeight);
    ctx.lineTo(leftMargin + chartWidth, topMargin + chartHeight);
    ctx.stroke();

    // X axis tick marks and labels
    var xTickStep = totalDuration <= 1800 ? 300 : 600;
    for (var xTick = 0; xTick <= totalDuration; xTick += xTickStep) {
      var tickX = leftMargin + (xTick / totalDuration) * chartWidth;
      var tickLabel = '' + Math.round(xTick / 60);
      var tickLabelWidth = ctx.measureText(tickLabel).width;

      ctx.strokeStyle = '#333333';
      ctx.beginPath();
      ctx.moveTo(tickX, topMargin + chartHeight);
      ctx.lineTo(tickX, topMargin + chartHeight + 2);
      ctx.stroke();

      var tickLabelX = tickX - tickLabelWidth / 2;
      if (tickLabelX + tickLabelWidth > leftMargin + chartWidth) tickLabelX = leftMargin + chartWidth - tickLabelWidth;
      ctx.fillStyle = '#AAAAAA';
      ctx.fillText(tickLabel, tickLabelX, topMargin + chartHeight + 6);
    }

    // Vertical time marker
    if (currentTime > 0) {
      var markerX = leftMargin + Math.min(1, currentTime / totalDuration) * chartWidth;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(markerX, topMargin);
      ctx.lineTo(markerX, topMargin + chartHeight);
      ctx.stroke();
    }
  };
"
onActivate="
  durationToken = $.subscribe('/Activity/Move/-1/Duration/Current', function(elapsedTime) {
    currentTime = elapsedTime;
    setText('#elapsedVal', formatTime(elapsedTime));
    setText('#intervalVal', formatTime(calcIntervalRemaining(elapsedTime)));
    control('#intervalChart', 'REFRESH');
  });
"
onDeactivate="
  if (durationToken) $.unsubscribe(durationToken);
  durationToken = undefined;
">

  <object id="intervalChart" type="canvas"
          build="ctx => drawChart(ctx)"
          style="position:absolute; left:8%; width:80%; top:23%; height:48%;" />

  <div class="sp-title-bg" style="width:100%;height:17%;"></div>
  <div class="sp-title-text sp-t-s p-hc" style="top:5%">Interval Progress</div>

  <!-- Elapsed time -->
  <div class="sp-t-s cm-mid" style="position:absolute; top:72%; left:calc(35% - 50%e);">elapsed</div>
  <div id="elapsedVal" class="sp-b-m f-num" style="position:absolute; top:calc(85% - 50%e); left:calc(35% - 50%e);">-:--</div>

  <!-- Remaining in current interval -->
  <div class="sp-t-s cm-mid" style="position:absolute; top:72%; left:calc(65% - 50%e);">interval</div>
  <div id="intervalVal" class="sp-b-m f-num" style="position:absolute; top:calc(85% - 50%e); left:calc(65% - 50%e);">-:--</div>

</uiView>
